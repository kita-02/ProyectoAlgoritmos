name: pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Ejecutar pruebas con cobertura
        run: pytest --cov=rsa_edu --cov-report=term-missing
      - name: Demostración de la CLI (instancia del Avance 1)
        run: |
          python -m rsa_edu claves -p 61 -q 53 -e 17 --salida clave.json
          python -m rsa_edu cifrar 65 --claves clave.json
          python -m rsa_edu descifrar 2790 --claves clave.json --crt
          python -m rsa_edu atacar -n 3233 -e 17
