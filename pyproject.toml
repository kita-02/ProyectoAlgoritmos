[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-edu"
version = "0.2.0"
description = "Biblioteca educativa de teoría de números y cifrado RSA (Grupo 6, Algoritmos Avanzados)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "sympy>=1.12"]
gmp = ["gmpy2>=2.1"]

[project.scripts]
rsa-edu = "rsa_edu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
